<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#17181c;--mut:#5d6470;--line:#dde1e8;--y:#f2c811;--b:#0f78d4;--ok:#16794a;--okb:#e3f5ea;--no:#b3261e;--nob:#fde8e6;--bar:#17181c;--bart:#f4f4f4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101216;--card:#1a1d23;--ink:#eef0f3;--mut:#9aa3b0;--line:#2b303a;--ok:#5fd195;--okb:#12301f;--no:#ff8a80;--nob:#3a1816;--bar:#0a0b0e;--b:#5aaeff}}
:root[data-theme=dark]{--bg:#101216;--card:#1a1d23;--ink:#eef0f3;--mut:#9aa3b0;--line:#2b303a;--ok:#5fd195;--okb:#12301f;--no:#ff8a80;--nob:#3a1816;--bar:#0a0b0e;--b:#5aaeff}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bar);color:var(--bart);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:flex-end;gap:3px;height:26px}
.logo i{display:block;width:6px;background:var(--y);border-radius:1px}
.logo i:nth-child(1){height:10px}.logo i:nth-child(2){height:18px}.logo i:nth-child(3){height:26px}
.brand{font-weight:700;font-size:18px;flex:1}
.pill{font-size:13px;background:#ffffff1f;border-radius:99px;padding:3px 12px;white-space:nowrap}
.tool{background:#ffffff1f;border:0;border-radius:8px;color:inherit;padding:4px 10px;font-size:13px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:thin}
.strip button{flex:none;border:0;background:none;color:#c9ced8;padding:9px 14px;border-bottom:3px solid transparent;font-size:15px;white-space:nowrap}
.strip button.on{color:#fff;border-color:var(--y);font-weight:700}
#sub{background:var(--card);border-bottom:1px solid var(--line)}
#sub button{color:var(--mut);font-size:13px;padding:7px 11px;border-bottom:2px solid transparent}
#sub button.on{color:var(--ink);border-color:var(--b);font-weight:700}
#sub button.done::after{content:" ✓";color:var(--ok)}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.25;margin:6px 0 10px}
h2{font-size:clamp(21px,3.5vw,28px);margin:0 0 6px;line-height:1.3}
.tag{display:inline-block;font-size:13px;color:var(--mut);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pc{text-align:start;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--y);border-radius:10px;padding:14px 16px}
.pc:hover{border-color:var(--b);border-inline-start-color:var(--y)}
.pc b{display:block;font-size:17px}.pc span{font-size:14px;color:var(--mut)}
.btn{background:var(--y);color:#17181c;border:0;border-radius:8px;padding:9px 20px;font-weight:700}
.btn.g{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.q{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--b);border-radius:10px;padding:16px 18px;margin:18px 0}
.q>b{display:block;margin-bottom:10px}
.q button.o{display:block;width:100%;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 14px;margin:7px 0}
.q button.o:not(:disabled):hover{border-color:var(--b)}
.q button.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}
.q button.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.fb{font-size:14px;margin-top:6px;color:var(--mut)}
.pager{display:flex;justify-content:space-between;margin-top:20px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--y);width:0;transition:width .4s}
.res{font-size:22px;font-weight:700}
#pr{display:none}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 16px 30px}
@media print{header,main,footer{display:none!important}#pr{display:block}body{background:#fff;color:#000;font-size:12px}.pt{display:block;font-size:20px;font-weight:700;border-bottom:3px solid #f2c811;margin:22px 0 8px;break-before:page}.pi{break-inside:avoid;margin:10px 0;border-bottom:1px solid #ccc;padding-bottom:6px}.pi h3{margin:0}.pi p{margin:2px 0}.pi ol{margin:2px 0;padding-inline-start:20px}}
html[lang=ar] body{line-height:1.95}.brand{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:520px){.brand{font-size:15px}.top{gap:8px;padding:8px 12px}.tool{padding:4px 8px}}@page{margin:14mm}</style>
